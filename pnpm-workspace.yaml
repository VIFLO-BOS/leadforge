packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: postinstall build scripts run only for explicitly approved packages.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  msgpackr-extract: false
  "@scarf/scarf": false
  "@swc/core": true

# Security overrides (docs/SECURITY_AND_DATA_COLLECTION.md section 11, Phase 7 audit).
# multer: @nestjs/platform-express pins 2.4.0; 2.5.0 fixes GHSA DoS via a pending async
# fileFilter after request teardown (same major, no API change).
# postcss: next 15.5.x pins 8.4.31 (GHSA-6g55-p6wh-862q, GHSA-r28c-9q8g-f849,
# GHSA-fxqj-rqcc-2cmp, GHSA-qx2v-qp2m-jg93); 8.5.23 fixes all four (same major). Drop this
# once a Next.js release ships a fixed PostCSS.
overrides:
  multer: ^2.5.0
  next>postcss: ^8.5.23
