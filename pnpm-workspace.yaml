packages:
  - "apps/*"
  - "packages/*"

# pnpm 11: postinstall build scripts run only for explicitly approved packages.
allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  argon2: true
  esbuild: true
  sharp: true
  "@tailwindcss/oxide": true
  unrs-resolver: true
  msgpackr-extract: false
  "@scarf/scarf": false
