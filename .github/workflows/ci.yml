name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: leadforge
          POSTGRES_PASSWORD: leadforge
          POSTGRES_DB: leadforge
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U leadforge"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://leadforge:leadforge@localhost:5432/leadforge?schema=public
      MONGODB_URI: mongodb://localhost:27017/?replicaSet=rs0&directConnection=true
      MONGODB_DB: leadforge_test
      REDIS_URL: redis://localhost:6379
      APP_URL: http://localhost:3000
      API_URL: http://localhost:4000
      CSRF_SECRET: ci-csrf-secret-not-for-production-32
      SMTP_URL: smtp://localhost:1025
      MAIL_FROM: "LeadForge CI <ci@leadforge.local>"
    steps:
      - uses: actions/checkout@v4

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0 --bind_ip_all
          for i in $(seq 1 30); do
            if docker exec mongo mongosh --quiet --eval "db.adminCommand('ping').ok" >/dev/null 2>&1; then break; fi
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"localhost:27017"}]})'

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Generate dev JWT keys
        run: pnpm gen:keys --ci >> "$GITHUB_ENV"

      - name: Prisma generate and migrate
        run: pnpm db:migrate:deploy

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm --filter @leadforge/web exec playwright install --with-deps chromium

      - name: End-to-end viewport smoke
        run: pnpm test:e2e
